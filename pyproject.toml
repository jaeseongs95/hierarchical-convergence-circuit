[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-convergence-circuit"
version = "0.3.3"
description = "HCR adaptive graph-circuit learning reference engine with R0.1 compatibility"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hcr = "hcr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
